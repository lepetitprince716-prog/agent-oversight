[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-oversight"
dynamic = ["version"]
description = "Read-only drift report between a task tracker and what is actually true"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oversight = "oversight.cli:main"

[tool.setuptools.dynamic]
version = { attr = "oversight.__version__" }

[tool.setuptools.packages.find]
include = ["oversight*"]
