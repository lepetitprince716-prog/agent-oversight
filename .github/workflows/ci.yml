name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the privacy scan reads the whole history
          persist-credentials: false
      - name: Tests
        run: python3 -B -m unittest discover -s tests
      - name: Privacy scan of the tree and the whole history
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          scanner=tools/privacy_scan.py
          rules=tools/privacy_rules.json
          if [ -n "$BASE_REF" ]; then
            # On a pull request the scanner and its rules come from the base branch,
            # so a change cannot loosen the rules it is judged by. This file runs as
            # the pull request has it: read a change to it before merging.
            git show "origin/$BASE_REF:tools/privacy_scan.py" > "$RUNNER_TEMP/privacy_scan.py"
            git show "origin/$BASE_REF:tools/privacy_rules.json" > "$RUNNER_TEMP/privacy_rules.json"
            scanner="$RUNNER_TEMP/privacy_scan.py"
            rules="$RUNNER_TEMP/privacy_rules.json"
          fi
          python3 -B "$scanner" --rules "$rules" --tracked --history
      - name: Check-integrity scan of the commits being added
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          scanner=tools/check_integrity.py
          rules=tools/check_integrity_rules.json
          overlay=""
          if [ -n "$BASE_REF" ]; then
            if git cat-file -e "origin/$BASE_REF:tools/check_integrity.py" 2>/dev/null; then
              # As with the privacy scan: on a pull request the scanner, its rules and the
              # repository's .check-integrity.json come from the base branch, so a change
              # cannot loosen the checks it is judged by.
              git show "origin/$BASE_REF:tools/check_integrity.py" > "$RUNNER_TEMP/check_integrity.py"
              git show "origin/$BASE_REF:tools/check_integrity_rules.json" > "$RUNNER_TEMP/check_integrity_rules.json"
              scanner="$RUNNER_TEMP/check_integrity.py"
              rules="$RUNNER_TEMP/check_integrity_rules.json"
              if ! grep -q -- '--no-overlay' "$scanner"; then
                :  # an older scanner on the base branch knows no overlay file
              elif git cat-file -e "origin/$BASE_REF:.check-integrity.json" 2>/dev/null; then
                git show "origin/$BASE_REF:.check-integrity.json" > "$RUNNER_TEMP/check-integrity-overlay.json"
                overlay="--overlay $RUNNER_TEMP/check-integrity-overlay.json"
              else
                overlay="--no-overlay"
              fi
            fi
            # Otherwise the base branch has no scanner yet: this is the pull request that
            # first adds it, so it is judged by its own copy. Read it before merging.
            # The head commit of the pull request, not the merge commit CI checks out: the
            # merge commit has no Check-change line and would be judged as a whole.
            python3 -B "$scanner" --rules "$rules" $overlay --range "origin/$BASE_REF..$PR_HEAD"
          else
            if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              # A pull request that lands here is squashed or merged into commits that carry
              # none of the Check-change lines of the commits it was made of, and the pull
              # request itself was judged commit by commit before it landed, so a push to the
              # default branch has nothing left to add. Every other push is scanned.
              echo "check-integrity: skipped on a push to the default branch ($DEFAULT_BRANCH): its pull request was scanned commit by commit"
              exit 0
            fi
            case "$BEFORE" in
              *[!0]*) first=no ;;
              *) first=yes ;;
            esac
            if [ "$first" = no ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              first=yes # a force push: the old tip is not in this clone
            fi
            if [ "$first" = yes ]; then
              python3 -B "$scanner" --rules "$rules" --commit "$AFTER"
            else
              python3 -B "$scanner" --rules "$rules" --range "$BEFORE..$AFTER"
            fi
          fi
