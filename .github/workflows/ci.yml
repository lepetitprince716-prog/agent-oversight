name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request is judged by its head commit alone, so a newer run replaces the older one
  # and they share a group per ref. A push is scanned from the old tip to the new one, so a
  # skipped run would leave the commits it brought unscanned: every push run gets a group of
  # its own. Pushes could not share one with cancel-in-progress off either, because GitHub
  # replaces a run that is still waiting in a group with the one queued after it.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The two scans judge a change, so they run in a job of their own with no step that runs
  # the repository's tests or build: those run apart, in the tests job. The interpreter runs
  # in isolated mode (-I), which keeps the scanner's own directory and the environment out
  # of the module search path, so a file dropped next to the scanner cannot stand in for a
  # standard library module.
  #
  # The check-integrity step comes first. On a pull request both scans use the base branch's
  # scanner. On a push the privacy scan runs tools/privacy_scan.py as the pushed commit
  # has it, and a scanner of that kind can move origin/<default branch> to HEAD, which would
  # leave a check-integrity step that ran after it with no commits to scan. So the commit
  # check, which takes its scanner from the baseline, has judged the push by then, and a
  # change to the privacy scanner is itself a finding of that check (check-machinery-changed).
  # The privacy step runs even when the step before it failed, so a privacy finding is never
  # hidden behind an unrelated commit finding.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request the default checkout is a merge commit GitHub makes for the run,
          # with the web identity of the account that opened it. The scans judge the head commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the privacy scan reads the whole history
          persist-credentials: false
      - name: Check-integrity scan of the commits being added
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          scanner=tools/check_integrity.py
          rules=tools/check_integrity_rules.json
          overlay=""
          mode=--range
          on_default=no
          # A branch is named by its full ref and turned into a commit id once; only that id is
          # used after. git reads a short name such as origin/main as refs/tags/origin/main before
          # refs/remotes/origin/main, and the checkout fetches every tag, so a pushed tag of that
          # name would otherwise stand in for the branch: an empty range that passes, or a commit
          # with a scanner of the tag author's choosing as the judge. rev-parse looks a full name up
          # the same way once the branch itself is missing (a tag called refs/remotes/origin/main
          # would answer), so show-ref --verify, which takes the name exactly, finds the commit.
          branch_commit() {
            oid=$(git show-ref --verify --hash "refs/remotes/origin/$1" 2>/dev/null) || return 1
            git rev-parse --verify --quiet --end-of-options "$oid^{commit}"
          }
          if [ -n "$BASE_REF" ]; then
            judge=$(branch_commit "$BASE_REF") || {
              echo "check-integrity: refs/remotes/origin/$BASE_REF, the base branch of the pull request, is not in this clone"
              exit 2
            }
            # The head commit of the pull request, not the merge commit CI checks out: the
            # merge commit has no Check-change line and would be judged as a whole.
            target="$judge..$PR_HEAD"
            if [ "$(git rev-list --count "$target")" = 0 ]; then
              # A range with nothing in it is never a pass: there is nothing to judge.
              echo "check-integrity: the pull request brings no commit beyond its base $BASE_REF ($judge), so there is nothing to judge"
              exit 1
            fi
          else
            if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              # The push has already landed, so a finding cannot stop it, and a pull request
              # that was squashed carries none of the Check-change lines it was judged with.
              # The commits are still scanned and a finding is shown as a warning.
              on_default=yes
              judge="$BEFORE"
            else
              judge=$(branch_commit "$DEFAULT_BRANCH") || {
                echo "check-integrity: refs/remotes/origin/$DEFAULT_BRANCH, the default branch, is not in this clone"
                exit 2
              }
            fi
            case "$BEFORE" in
              *[!0]*) first=no ;;
              *) first=yes ;;
            esac
            if [ "$first" = no ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              first=yes # a force push: the old tip is not in this clone
            fi
            if [ "$first" = no ]; then
              target="$BEFORE..$AFTER"
            elif [ "$on_default" = yes ]; then
              echo "check-integrity: nothing to scan on this push to the default branch ($DEFAULT_BRANCH): the repository's first push, or the old tip is not in this clone (a force push)"
              exit 0
            elif base=$(git merge-base "$judge" "$AFTER" 2>/dev/null); then
              # A new branch or a force push brings every commit the branch has beyond the
              # default branch, not only the tip.
              target="$base..$AFTER"
            else
              echo "check-integrity: $AFTER has no common history with origin/$DEFAULT_BRANCH ($judge), so only the top commit is scanned"
              mode=--commit
              target="$AFTER"
            fi
          fi
          if git cat-file -e "$judge:tools/check_integrity.py" 2>/dev/null; then
            # On a pull request and on a push the scanner, its rules and the repository's
            # .check-integrity.json come from the baseline (the base branch, the default
            # branch, or the old tip of a push to the default branch), so a change cannot
            # loosen the checks it is judged by.
            git show "$judge:tools/check_integrity.py" > "$RUNNER_TEMP/check_integrity.py"
            git show "$judge:tools/check_integrity_rules.json" > "$RUNNER_TEMP/check_integrity_rules.json"
            scanner="$RUNNER_TEMP/check_integrity.py"
            rules="$RUNNER_TEMP/check_integrity_rules.json"
            if ! grep -q -- '--no-overlay' "$scanner"; then
              :  # an older scanner on the baseline knows no overlay file
            elif git cat-file -e "$judge:.check-integrity.json" 2>/dev/null; then
              git show "$judge:.check-integrity.json" > "$RUNNER_TEMP/check-integrity-overlay.json"
              overlay="--overlay $RUNNER_TEMP/check-integrity-overlay.json"
            else
              overlay="--no-overlay"
            fi
          fi
          # Otherwise the baseline has no scanner yet: this is the change that first adds it,
          # so it is judged by its own copy. Read it before merging.
          code=0
          python3 -I -B "$scanner" --rules "$rules" $overlay "$mode" "$target" || code=$?
          if [ "$on_default" = yes ] && [ "$code" = 1 ]; then
            echo "::warning::check-integrity: unjustified changes landed on $DEFAULT_BRANCH (see the scan above); a squash merge can drop the Check-change line, so confirm the change was intended"
            exit 0
          fi
          exit "$code"
      - name: Privacy scan of the tree and the whole history
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          scanner=tools/privacy_scan.py
          rules=tools/privacy_rules.json
          if [ -n "$BASE_REF" ]; then
            # On a pull request the scanner and its rules come from the base branch,
            # so a change cannot loosen the rules it is judged by. This file runs as
            # the pull request has it: read a change to it before merging. The branch is
            # named by its exact full ref (show-ref --verify), so a tag called origin/<base>
            # or refs/remotes/origin/<base> cannot stand in for it.
            base=$(git show-ref --verify --hash "refs/remotes/origin/$BASE_REF" 2>/dev/null) &&
              base=$(git rev-parse --verify --quiet --end-of-options "$base^{commit}") || {
              echo "privacy_scan: error: refs/remotes/origin/$BASE_REF, the base branch of the pull request, is not in this clone"
              exit 2
            }
            git show "$base:tools/privacy_scan.py" > "$RUNNER_TEMP/privacy_scan.py"
            git show "$base:tools/privacy_rules.json" > "$RUNNER_TEMP/privacy_rules.json"
            scanner="$RUNNER_TEMP/privacy_scan.py"
            rules="$RUNNER_TEMP/privacy_rules.json"
          fi
          python3 -I -B "$scanner" --rules "$rules" --tracked --history

  # The repository's own tests run code from the repository, so they run apart from the scans.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -B -m unittest discover -s tests
